# Window advisor preferences.
#
# Secrets do NOT go here -- see .env.example. This file is safe to commit.

location:
  zip: "75287"
  # Dallas/Addison Airport (KADS) -- the nearest reporting station, so this is
  # a real point rather than a guessed ZIP centroid. Run
  #   python -m weather_advice resolve
  # to confirm: it prints the city NWS matched and checks the station below is
  # one NWS actually associates with this grid cell.
  lat: 32.97
  lon: -96.83
  approximate: false
  # Pin the observation station used for the accuracy record.
  #
  # This matters more than it looks. Accuracy is a comparison across time, and
  # a comparison only means something if the thing being compared holds still.
  # Left blank, the client takes whichever nearby station answers first -- so a
  # KADS outage silently swaps in an airport miles away and "forecast error"
  # quietly starts measuring the distance between two stations instead of the
  # quality of the forecast. A pinned station deliberately does NOT fall back:
  # missing a few rows is recoverable, a history that mixes sources is not.
  station: KADS

schedule:
  # Windows must be open BY bedtime -- after this nobody is up to do it.
  bedtime: "23:00"
  wake_weekday: "08:00"
  # You said "9 or 10am" on weekends. 9 is the safe default: it is the earlier
  # of the two, so the advice never assumes you will still be asleep at 10.
  # Change to "10:00" if you would rather have the longer window.
  wake_weekend: "09:00"
  # No point suggesting 2pm; this is the earliest you would actually act.
  open_earliest: "20:00"

thresholds:
  # "Below 78 or 77" -- change this one number to switch.
  max_temp_f: 78
  # A floor, so a 34F January night does not read as a nine-hour opportunity.
  # Set to off to disable it entirely.
  min_temp_f: 50
  # Chance-of-rain percentage at or above which an hour is treated as wet.
  # Conservative on purpose: you are asleep and cannot close them.
  max_precip_pct: 20
  # OFF by default. Dallas is humid and 75F at a 72F dewpoint is muggy, but
  # you asked for a temperature rule -- switch this on only if you want
  # humidity to be able to veto a night that passes the temperature test.
  max_dewpoint_f: off
  # OFF by default. Set a number (e.g. 20) if wind blowing rain in, or noise,
  # matters to you.
  max_wind_mph: off
  # What you actually want.
  target_hours: 6
  # Below this, opening them is a hassle and you get no alert at all.
  min_hours: 3
  # A null chance-of-rain from NWS is treated as "might rain", not as zero.
  # Leave this true unless you enjoy surprises.
  unknown_precip_blocks: true

alerts:
  # Which verdicts are worth a message. "shut" is deliberately absent: a
  # nightly "no" is how you train yourself to ignore the channel.
  routes: [open, marginal]
  # Which verdicts also get the SMS leg. A marginal night is real but a
  # hassle, so by default only a genuinely good night buzzes the phone.
  sms_routes: [open]
